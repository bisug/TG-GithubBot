services:
  bot:
    build: .
    container_name: tg_githubbot
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_WEBHOOK_URL=${TELEGRAM_WEBHOOK_URL}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - MONGODB_URI=mongodb://mongo:27017
      - DATABASE_NAME=${DATABASE_NAME:-github_bot}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - USE_POLLING=${USE_POLLING:-true}
      - PORT=8080
    depends_on:
      - mongo

  mongo:
    image: mongo:8.3
    container_name: tg_githubbot_mongo
    restart: unless-stopped
    # No ports mapping: Mongo stays on the compose network only. Exposing it
    # unauthenticated on all interfaces is a data-leak risk. If you need host
    # access for debugging, use "127.0.0.1:27017:27017" instead.
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
